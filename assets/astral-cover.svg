<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="78%">
      <stop offset="0%" stop-color="#0c1430"/>
      <stop offset="60%" stop-color="#070a18"/>
      <stop offset="100%" stop-color="#03040a"/>
    </radialGradient>
    <linearGradient id="star" x1="8%" y1="8%" x2="92%" y2="92%">
      <stop offset="0%" stop-color="#9ff3ff"/>
      <stop offset="45%" stop-color="#5b8dff"/>
      <stop offset="100%" stop-color="#a24bff"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#d8f4ff"/>
      <stop offset="100%" stop-color="#7de8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7de8ff"/>
      <stop offset="100%" stop-color="#a24bff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g fill="#cfe6ff">
    <circle cx="86" cy="96" r="2.2" opacity="0.85"/>
    <circle cx="150" cy="410" r="1.6" opacity="0.6"/>
    <circle cx="430" cy="120" r="1.8" opacity="0.7"/>
    <circle cx="392" cy="404" r="2.4" opacity="0.8"/>
    <circle cx="64" cy="300" r="1.4" opacity="0.5"/>
    <circle cx="470" cy="268" r="1.5" opacity="0.65"/>
    <circle cx="120" cy="180" r="1.3" opacity="0.5"/>
  </g>

  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="212" ry="80" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.5"/>
  </g>

  <circle cx="256" cy="256" r="122" fill="url(#core)" opacity="0.9"/>

  <path filter="url(#glow)" fill="url(#star)"
